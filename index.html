<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,input,select,textarea{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;background:#fafafa;padding-bottom:84px}header{position:sticky;top:0;z-index:20;background:#fafafaf2;backdrop-filter:blur(12px);padding:15px;border-bottom:1px solid #e5e5e5}.brand{font-size:22px;font-weight:900}.small{font-size:12px;color:#777}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.search{margin-top:10px;background:#eee;border-radius:12px;padding:10px}.search input{width:100%;border:0;background:none;outline:0;font-size:16px}.screen{display:none;padding:16px}.screen.on{display:block}.hero{padding:8px 0 18px}.hero h2{margin:0 0 8px}.hero p{margin:0;color:#666;line-height:1.6}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.pill{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap}.pill.on{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.panel,.request{background:#fff;border:1px solid #e4e4e4;border-radius:16px;overflow:hidden}.photo{aspect-ratio:1;background:#eee;display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:11px}.name{font-weight:800}.meta{font-size:12px;color:#777;margin-top:4px}.tag,.status{display:inline-block;background:#f0f0f0;border-radius:999px;padding:5px 8px;font-size:11px;margin-top:7px}.panel,.request{padding:14px;margin-bottom:11px}.btn{width:100%;border:0;background:#111;color:#fff;border-radius:12px;padding:13px;font-weight:800;margin-top:9px}.btn.light{background:#eee;color:#111}.btn.danger{background:#b42318}.link{border:0;background:none;text-decoration:underline;padding:4px}.form{display:grid;gap:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px;font-size:16px}.field textarea{min-height:90px}.nav{position:fixed;bottom:0;left:0;right:0;max-width:720px;margin:auto;background:#fffffff7;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:none;color:#777;font-size:11px}.nav b{display:block;font-size:20px}.nav .on{color:#111;font-weight:800}.empty{text-align:center;color:#888;padding:44px 10px}.modal{position:fixed;inset:0;background:#0008;z-index:60;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}.toast{position:fixed;left:16px;right:16px;bottom:90px;max-width:688px;margin:auto;background:#111;color:#fff;border-radius:12px;padding:12px;z-index:80;display:none}.toast.on{display:block}.chat{display:grid;gap:8px;margin:12px 0}.msg{max-width:82%;padding:9px 11px;border-radius:13px;background:#eee}.msg.me{margin-left:auto;background:#111;color:#fff}.legal{line-height:1.8;color:#333}.divider{border:0;border-top:1px solid #eee;margin:15px 0}
</style><title>めじるし交換</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.SUPABASE_URL="https://nawitoxbgtmurbbuydyi.supabase.co";
window.SUPABASE_ANON_KEY="sb_publishable_jaSr6lJckE23R8pZNsG9BA_SzgM29U_";
</script>
</head><body><div class="app">
<header><div class="row"><div><div class="brand">めじるし交換</div><div class="small">めじるしチャームを交換するアプリ</div></div><div class="row"><button class="link" id="notifyBtn" style="display:none">🔔<span id="notifyCount"></span></button><button class="link" id="authBtn">ログイン</button></div></div><div class="search">🔎 <input id="q" placeholder="チャーム名・シリーズで検索"></div></header>
<main>
<section id="home" class="screen on"><div class="hero"><h2>欲しいチャームを探そう</h2><p>自分のチャームを出品して、欲しいチャームと交換できます。</p></div><div class="filters"><button class="pill on" data-f="すべて">すべて</button><button class="pill" data-f="サンリオ">サンリオ</button><button class="pill" data-f="ディズニー">ディズニー</button><button class="pill" data-f="その他">その他</button></div><div id="grid" class="grid"></div></section>
<section id="detail" class="screen"></section>
<section id="add" class="screen"><h2>チャームを出品</h2><div class="form"><div class="field"><label>チャーム名</label><input id="fName"></div><div class="field"><label>シリーズ</label><select id="fSeries"><option>サンリオ</option><option>ディズニー</option><option>その他</option></select></div><div class="field"><label>状態</label><select id="fState"><option>未開封</option><option>開封済み・美品</option><option>使用感あり</option></select></div><div class="field"><label>写真</label><input id="fImage" type="file" accept="image/*"></div><div class="field"><label>説明</label><textarea id="fNote"></textarea></div><button class="btn" id="addBtn">出品する</button></div></section>
<section id="trade" class="screen"><div class="row"><h2>交換</h2><button class="link" id="refreshTrade">更新</button></div><div id="tradeList"></div></section>
<section id="room" class="screen"></section>
<section id="me" class="screen"><h2>マイページ</h2><div id="profile"></div><div id="adminPanel"></div><h3>自分の出品</h3><div id="mine"></div><hr class="divider"><div class="panel"><button class="link" onclick="showLegal('terms')">利用規約</button><br><button class="link" onclick="showLegal('privacy')">プライバシーポリシー</button></div></section>
<section id="notifications" class="screen"><div class="row"><h2>通知</h2><button class="link" onclick="markAllNotificationsRead()">すべて既読</button></div><div id="notificationList"></div></section>
<section id="admin" class="screen"><div class="row"><h2>運営管理</h2><button class="link" onclick="go('me')">戻る</button></div><div id="reportList"></div></section>
<section id="legal" class="screen"></section>
</main>
<nav class="nav"><button class="on" data-screen="home"><b>⌂</b>ホーム</button><button data-screen="add"><b>＋</b>出品</button><button data-screen="trade"><b>⇄</b>交換</button><button data-screen="me"><b>●</b>マイページ</button></nav></div>

<div id="authModal" class="modal"><div class="sheet"><div class="row"><h2 id="authTitle">ログイン</h2><button class="link" id="closeAuth">閉じる</button></div><div class="form"><div class="field"><label>メール</label><input id="email" type="email"></div><div class="field"><label>パスワード</label><input id="password" type="password"></div><div class="field" id="usernameWrap"><label>ユーザー名</label><input id="username"></div><button class="btn" id="authSubmit">ログイン</button><button class="btn light" id="toggleAuth">新規登録はこちら</button><button class="link" id="resetPasswordBtn" type="button" style="display:none">パスワードを忘れた方</button></div></div></div>
<div id="toast" class="toast"></div>

<script>const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null,items=[],trades=[],filter='すべて',authMode='login',blockedIds=[];
const $=id=>document.getElementById(id),esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2800)}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.screen===id));if(id==='home')loadItems();if(id==='trade')loadTrades();if(id==='me')loadMine();scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.screen));
document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('on',x===b));renderItems()});$('q').oninput=renderItems;
const photo=u=>`<div class="photo">${u?`<img src="${u}" loading="lazy">`:'✨'}</div>`;

async function loadBlocks(){blockedIds=[];if(!user)return;let r=await sb.from('blocks').select('blocked_id').eq('blocker_id',user.id);blockedIds=(r.data||[]).map(x=>x.blocked_id)}
async function loadItems(){await loadBlocks();let r=await sb.from('charms').select('id,name,series,condition,description,image_url,owner_id,profiles(username)').eq('status','available').order('created_at',{ascending:false});if(r.error)return toast(r.error.message);items=(r.data||[]).filter(x=>!blockedIds.includes(x.owner_id));renderItems()}
function renderItems(){let q=$('q').value.toLowerCase(),a=items.filter(x=>(filter==='すべて'||x.series===filter)&&(x.name+' '+x.series).toLowerCase().includes(q));$('grid').innerHTML=a.map(x=>`<div class="card" onclick="detail('${x.id}')">${photo(x.image_url)}<div class="body"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.series)} ・ ${esc(x.condition)}</div><div class="tag">交換できます</div></div></div>`).join('')||'<div class="empty" style="grid-column:1/-1">出品中のチャームがありません</div>'}
window.detail=async id=>{let x=items.find(a=>a.id===id);if(!x)return;let mine=[];if(user){let r=await sb.from('charms').select('id,name').eq('owner_id',user.id).eq('status','available');mine=r.data||[]}let opts=mine.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');$('detail').innerHTML=`<button class="link" onclick="go('home')">← 戻る</button>${photo(x.image_url)}<h2>${esc(x.name)}</h2><div class="small">${esc(x.series)} ・ ${esc(x.condition)} ・ ${esc(x.profiles?.username||'ユーザー')}</div><p>${esc(x.description||'')}</p>${!user?'<button class="btn" onclick="openAuth()">ログインして交換申請</button>':x.owner_id===user.id?'<div class="panel">あなたの出品です。</div>':`<div class="panel"><b>交換に出す自分のチャーム</b><select id="offerSelect" style="width:100%;padding:12px;margin-top:9px;border:1px solid #ddd;border-radius:12px">${opts}</select><button class="btn" onclick="sendTrade('${x.id}')">交換を申し込む</button></div><button class="btn light" onclick="blockUser('${x.owner_id}')">ブロック</button><button class="btn light" onclick="reportUser('${x.owner_id}')">通報</button>`}`;go('detail')};
window.sendTrade=async wanted=>{if(!user)return openAuth();let offered=$('offerSelect')?.value;if(!offered)return toast('交換に出すチャームがありません');let x=items.find(i=>i.id===wanted);let r=await sb.from('trade_requests').insert({requester_id:user.id,owner_id:x.owner_id,wanted_charm_id:wanted,offered_charm_id:offered});if(r.error)return toast(r.error.message);toast('交換申請を送りました');go('trade')};
window.blockUser=async uid=>{if(!confirm('ブロックしますか？'))return;let r=await sb.from('blocks').insert({blocker_id:user.id,blocked_id:uid});if(r.error&&!String(r.error.message).includes('duplicate'))return toast(r.error.message);toast('ブロックしました');go('home')};
window.reportUser=async uid=>{let reason=prompt('通報理由を入力してください');if(!reason)return;let r=await sb.from('reports').insert({reporter_id:user.id,target_user_id:uid,reason});if(r.error)return toast(r.error.message);toast('通報しました')};

async function compressImage(file){return new Promise((resolve,reject)=>{let img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?resolve(b):reject(new Error('画像変換に失敗'))},'image/jpeg',.86)};img.onerror=()=>reject(new Error('写真を読み込めません'));img.src=u})}
$('addBtn').onclick=async()=>{if(!user)return openAuth();let name=$('fName').value.trim();if(!name)return toast('チャーム名を入力してください');let url=null,file=$('fImage').files[0];if(file){try{let blob=await compressImage(file),path=`${user.id}/${crypto.randomUUID()}.jpg`;let up=await sb.storage.from('charm-images').upload(path,await blob.arrayBuffer(),{contentType:'image/jpeg',upsert:false});if(up.error)return toast('画像: '+up.error.message);url=sb.storage.from('charm-images').getPublicUrl(path).data.publicUrl}catch(e){return toast(e.message)}}let r=await sb.from('charms').insert({owner_id:user.id,name,series:$('fSeries').value,condition:$('fState').value,description:$('fNote').value,image_url:url});if(r.error)return toast(r.error.message);$('fName').value='';$('fNote').value='';$('fImage').value='';toast('出品しました');go('me')};

const statusJa=s=>({pending:'申請中',accepted:'取引中',rejected:'お断り',cancelled:'キャンセル',shipping:'発送中',completed:'交換済み'}[s]||s);
async function loadTrades(){if(!user){$('tradeList').innerHTML='<div class="empty">ログインしてください</div>';return}let r=await sb.from('trade_requests').select('id,status,requester_id,owner_id,wanted_charm_id,offered_charm_id,requester_shipped_at,owner_shipped_at,requester_received_at,owner_received_at,wanted:charms!trade_requests_wanted_charm_id_fkey(name),offered:charms!trade_requests_offered_charm_id_fkey(name)').or(`requester_id.eq.${user.id},owner_id.eq.${user.id}`).order('created_at',{ascending:false});if(r.error)return $('tradeList').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';trades=r.data||[];$('tradeList').innerHTML=trades.map(t=>`<div class="request" onclick="openRoom('${t.id}')"><div class="row"><b>${esc(t.offered?.name)} ⇄ ${esc(t.wanted?.name)}</b><span class="status">${statusJa(t.status)}</span></div><div class="small">タップして取引詳細</div></div>`).join('')||'<div class="empty">交換はありません</div>'}
$('refreshTrade').onclick=loadTrades;
window.acceptTrade=async id=>{let r=await sb.rpc('accept_trade',{p_trade_id:id});if(r.error)return toast(r.error.message);toast('交換を承認しました');openRoom(id)};
window.rejectTrade=async id=>{let r=await sb.rpc('reject_trade',{p_trade_id:id});if(r.error)return toast(r.error.message);go('trade')};
window.cancelTrade=async id=>{if(!confirm('キャンセルしますか？'))return;let r=await sb.rpc('cancel_trade',{p_trade_id:id});if(r.error)return toast(r.error.message);toast('キャンセルしました');go('trade')};
window.shipTrade=async id=>{let r=await sb.rpc('mark_trade_shipped',{p_trade_id:id});if(r.error)return toast(r.error.message);toast('発送済みにしました');openRoom(id)};
window.receiveTrade=async id=>{let r=await sb.rpc('mark_trade_received',{p_trade_id:id});if(r.error)return toast(r.error.message);toast('受取確認しました');openRoom(id)};

window.openRoom=async id=>{let r=await sb.from('trade_requests').select('id,status,requester_id,owner_id,requester_shipped_at,owner_shipped_at,requester_received_at,owner_received_at,wanted:charms!trade_requests_wanted_charm_id_fkey(name),offered:charms!trade_requests_offered_charm_id_fkey(name)').eq('id',id).single();if(r.error)return toast(r.error.message);let t=r.data,incoming=t.owner_id===user.id,meShip=incoming?t.owner_shipped_at:t.requester_shipped_at,otherShip=incoming?t.requester_shipped_at:t.owner_shipped_at,meRecv=incoming?t.owner_received_at:t.requester_received_at;let controls='';if(t.status==='pending')controls=incoming?`<button class="btn" onclick="acceptTrade('${id}')">交換を承認</button><button class="btn light" onclick="rejectTrade('${id}')">断る</button>`:`<button class="btn light" onclick="cancelTrade('${id}')">申請を取り消す</button>`;if(['accepted','shipping'].includes(t.status)){if(!meShip)controls+=`<button class="btn" onclick="shipTrade('${id}')">発送しました</button>`;if(otherShip&&!meRecv)controls+=`<button class="btn" onclick="receiveTrade('${id}')">受け取りました</button>`;if(t.status==='accepted'&&!t.requester_shipped_at&&!t.owner_shipped_at)controls+=`<button class="btn light" onclick="cancelTrade('${id}')">取引をキャンセル</button>`}let reviews='';if(t.status==='completed'){let mine=await sb.from('reviews').select('rating,comment').eq('trade_id',id).eq('reviewer_id',user.id).maybeSingle();reviews=mine.data?`<div class="panel">あなたの評価：★${mine.data.rating}<br>${esc(mine.data.comment||'')}</div>`:`<div class="panel"><b>相手を評価</b><select id="rating" style="width:100%;padding:12px;margin-top:8px"><option value="5">★★★★★ 5</option><option value="4">★★★★ 4</option><option value="3">★★★ 3</option><option value="2">★★ 2</option><option value="1">★ 1</option></select><textarea id="reviewComment" style="width:100%;margin-top:8px;padding:12px;border:1px solid #ddd;border-radius:12px"></textarea><button class="btn" onclick="submitReview('${id}','${incoming?t.requester_id:t.owner_id}')">評価する</button></div>`}let msgs=await sb.from('messages').select('sender_id,body').eq('trade_id',id).order('created_at');let chat=(msgs.data||[]).map(m=>`<div class="msg ${m.sender_id===user.id?'me':''}">${esc(m.body)}</div>`).join('');$('room').innerHTML=`<button class="link" onclick="go('trade')">← 交換一覧</button><h2>${esc(t.offered?.name)} ⇄ ${esc(t.wanted?.name)}</h2><div class="panel"><div class="row"><b>ステータス</b><span class="status">${statusJa(t.status)}</span></div></div>${controls}${reviews}<hr class="divider"><h3>取引チャット</h3><div class="chat">${chat||'<div class="small">まだメッセージはありません</div>'}</div>${['accepted','shipping','completed'].includes(t.status)?`<div class="row"><input id="msgInput" placeholder="メッセージ" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:12px"><button class="btn" style="width:auto;margin:0" onclick="sendMsg('${id}')">送信</button></div>`:''}<button class="btn light" onclick="reportTrade('${id}','${incoming?t.requester_id:t.owner_id}')">この取引を通報</button>`;go('room')};
window.sendMsg=async id=>{let body=$('msgInput').value.trim();if(!body)return;let r=await sb.from('messages').insert({trade_id:id,sender_id:user.id,body});if(r.error)return toast(r.error.message);openRoom(id)};
window.submitReview=async(id,reviewee)=>{let r=await sb.from('reviews').insert({trade_id:id,reviewer_id:user.id,reviewee_id:reviewee,rating:+$('rating').value,comment:$('reviewComment').value});if(r.error)return toast(r.error.message);toast('評価しました');openRoom(id)};
window.reportTrade=async(id,uid)=>{let reason=prompt('通報理由を入力してください');if(!reason)return;let r=await sb.from('reports').insert({reporter_id:user.id,target_user_id:uid,target_trade_id:id,reason});if(r.error)return toast(r.error.message);toast('通報しました')};


async function loadMine(){if(!user){$('profile').innerHTML='<div class="panel">ログインしてください</div>';$('mine').innerHTML='';$('adminPanel').innerHTML='';return}let p=await sb.from('profiles').select('username,bio').eq('id',user.id).single(),rev=await sb.from('reviews').select('rating').eq('reviewee_id',user.id),ratings=(rev.data||[]).map(x=>x.rating),avg=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1):'-';$('profile').innerHTML=`<div class="panel"><b>${esc(p.data?.username||'ユーザー')}</b><div class="small">${esc(user.email||'')}</div><div style="margin-top:8px">${esc(p.data?.bio||'')}</div><div style="margin-top:8px">評価 ★ ${avg} ${ratings.length?`(${ratings.length}件)`:''}</div><button class="btn light" onclick="editProfile()">プロフィール編集</button><button class="btn light" onclick="logout()">ログアウト</button><button class="btn danger" onclick="deleteAccount()">アカウント削除</button></div>`;let r=await sb.from('charms').select('id,name,series,condition,image_url,status').eq('owner_id',user.id).order('created_at',{ascending:false});await refreshAdminPanel();$('mine').innerHTML=(r.data||[]).map(x=>`<div class="panel"><div class="row"><b>${esc(x.name)}</b><span class="status">${({available:'公開中',hidden:'非公開',pending:'取引中',traded:'交換済み'}[x.status]||x.status)}</span></div>${x.status==='available'?`<button class="btn light" onclick="hideCharm('${x.id}')">非公開にする</button>`:''}${x.status==='hidden'?`<button class="btn light" onclick="unhideCharm('${x.id}')">再公開する</button>`:''}${['available','hidden'].includes(x.status)?`<button class="btn danger" onclick="deleteCharm('${x.id}')">削除</button>`:''}</div>`).join('')||'<div class="empty">まだ出品していません</div>'}
window.editProfile=async()=>{let p=await sb.from('profiles').select('username,bio').eq('id',user.id).single(),u=prompt('ユーザー名',p.data?.username||''),b=prompt('自己紹介',p.data?.bio||'');if(u===null||b===null)return;let r=await sb.rpc('update_my_profile',{p_username:u,p_bio:b});if(r.error)return toast(r.error.message);toast('更新しました');loadMine()};
window.hideCharm=async id=>{let r=await sb.rpc('hide_my_charm',{p_charm_id:id});if(r.error)return toast(r.error.message);loadMine()};
window.unhideCharm=async id=>{let r=await sb.rpc('unhide_my_charm',{p_charm_id:id});if(r.error)return toast(r.error.message);loadMine()};
window.deleteCharm=async id=>{if(!confirm('この出品を削除しますか？'))return;let r=await sb.rpc('delete_my_charm',{p_charm_id:id});if(r.error)return toast(r.error.message);loadMine()};
window.deleteAccount=async()=>{if(!confirm('アカウントを削除します。元に戻せません。続けますか？'))return;let r=await sb.rpc('delete_my_account');if(r.error)return toast(r.error.message);toast('アカウントを削除しました');user=null;go('home')};



async function loadNotifications(){if(!user)return;let r=await sb.from('notifications').select('id,type,trade_id,message,read_at,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(50);if(r.error)return toast(r.error.message);let n=r.data||[],unread=n.filter(x=>!x.read_at).length;$('notifyCount').textContent=unread?` ${unread}`:'';$('notificationList').innerHTML=n.map(x=>`<div class="panel" onclick="openNotification('${x.id}','${x.trade_id||''}')"><div class="row"><b>${esc(x.message)}</b>${!x.read_at?'<span class="status">新着</span>':''}</div><div class="small">${new Date(x.created_at).toLocaleString('ja-JP')}</div></div>`).join('')||'<div class="empty">通知はありません</div>'}
$('notifyBtn').onclick=async()=>{await loadNotifications();go('notifications')};
window.openNotification=async(id,tradeId)=>{await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('user_id',user.id);await loadNotifications();if(tradeId)openRoom(tradeId)};
window.markAllNotificationsRead=async()=>{if(!user)return;let r=await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',user.id).is('read_at',null);if(r.error)return toast(r.error.message);loadNotifications()};
async function refreshAdminPanel(){if(!user){$('adminPanel').innerHTML='';return}let a=await sb.rpc('is_admin');if(a.error||!a.data){$('adminPanel').innerHTML='';return}$('adminPanel').innerHTML='<div class="panel"><b>運営者メニュー</b><button class="btn light" onclick="openAdmin()">通報を確認</button></div>'}
window.openAdmin=async()=>{let a=await sb.rpc('is_admin');if(a.error||!a.data)return toast('管理者権限がありません');let r=await sb.from('reports').select('id,reason,status,created_at,target_user_id,target_trade_id,reporter_id').order('created_at',{ascending:false}).limit(100);if(r.error)return toast(r.error.message);$('reportList').innerHTML=(r.data||[]).map(x=>`<div class="panel"><div class="row"><b>${esc(x.reason)}</b><span class="status">${x.status==='open'?'未対応':'対応済み'}</span></div><div class="small">${new Date(x.created_at).toLocaleString('ja-JP')}</div><div class="small">対象ユーザー: ${esc(x.target_user_id||'-')}</div><div class="small">取引: ${esc(x.target_trade_id||'-')}</div>${x.status==='open'?`<button class="btn" onclick="resolveReport('${x.id}')">対応済みにする</button>`:''}</div>`).join('')||'<div class="empty">通報はありません</div>';go('admin')};
window.resolveReport=async id=>{let r=await sb.rpc('resolve_report',{p_report_id:id});if(r.error)return toast(r.error.message);toast('対応済みにしました');openAdmin()};
window.showLegal=type=>{let terms=`<h2>利用規約</h2><div class="legal"><p>「めじるし交換」は、ユーザー同士がめじるしチャーム等を交換するための場を提供します。</p><p>交換・発送はユーザー自身の責任で行ってください。虚偽出品、詐欺、嫌がらせ、違法品・権利侵害品の出品は禁止します。</p><p>発送後の一方的なキャンセルはできません。トラブル時は取引画面から通報してください。</p><p>運営は安全確保のため、規約違反アカウントの利用制限・削除を行うことがあります。</p></div>`;let privacy=`<h2>プライバシーポリシー</h2><div class="legal"><p>本サービスでは、アカウント作成のためのメールアドレス、ユーザー名、出品情報、画像、取引メッセージ、評価、通報情報を取り扱います。</p><p>これらはログイン、交換機能、安全対策、トラブル対応のために利用します。</p><p>パスワードは認証基盤で管理され、アプリ運営者が平文で閲覧することはありません。</p><p>ユーザーはマイページからアカウント削除を申請できます。ただし進行中の交換がある場合は、安全のため完了またはキャンセル後に削除できます。</p></div>`;$('legal').innerHTML=`<button class="link" onclick="go('me')">← 戻る</button>${type==='terms'?terms:privacy}`;go('legal')};

function openAuth(){authMode='login';$('authModal').classList.add('on');updateAuth()}function updateAuth(){$('authTitle').textContent=authMode==='login'?'ログイン':'新規登録';$('authSubmit').textContent=authMode==='login'?'ログイン':'アカウントを作成';$('toggleAuth').textContent=authMode==='login'?'新規登録はこちら':'ログインはこちら';$('usernameWrap').style.display=authMode==='login'?'none':'block';$('resetPasswordBtn').style.display=authMode==='login'?'inline-block':'none'}$('authBtn').onclick=()=>user?logout():openAuth();$('closeAuth').onclick=()=>$('authModal').classList.remove('on');$('toggleAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';updateAuth()};$('resetPasswordBtn').onclick=async()=>{let email=$('email').value.trim();if(!email)email=prompt('登録しているメールアドレスを入力してください')||'';if(!email)return;let redirectTo=location.origin+location.pathname+'?reset=1';let r=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(r.error)return toast(r.error.message);toast('パスワード再設定メールを送りました')};$('authSubmit').onclick=async()=>{let email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return toast('メールと6文字以上のパスワードを入力してください');if(authMode==='login'){let r=await sb.auth.signInWithPassword({email,password});if(r.error)return toast(r.error.message);$('authModal').classList.remove('on')}else{let username=$('username').value.trim()||'めじるしユーザー';let r=await sb.auth.signUp({email,password,options:{data:{username}}});if(r.error)return toast(r.error.message);$('authModal').classList.remove('on');toast(r.data.session?'登録しました':'確認メールを確認してください')}};async function logout(){await sb.auth.signOut();go('home')}

sb.auth.onAuthStateChange(async(e,s)=>{user=s?.user||null;$('authBtn').textContent=user?'ログアウト':'ログイン';$('notifyBtn').style.display=user?'inline-block':'none';if(e==='PASSWORD_RECOVERY'){let np=prompt('新しいパスワードを6文字以上で入力してください');if(np&&np.length>=6){let u=await sb.auth.updateUser({password:np});toast(u.error?u.error.message:'パスワードを変更しました')}else if(np!==null){toast('6文字以上で入力してください')}}loadItems();if(user)loadNotifications()});
sb.auth.getSession().then(({data})=>{user=data.session?.user||null;$('authBtn').textContent=user?'ログアウト':'ログイン';$('notifyBtn').style.display=user?'inline-block':'none';loadItems();if(user)loadNotifications()});
</script></body></html>
