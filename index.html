<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,input,select,textarea{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;background:#fafafa;padding-bottom:84px}header{position:sticky;top:0;z-index:20;background:#fafafaf2;backdrop-filter:blur(12px);padding:15px;border-bottom:1px solid #e5e5e5}.brand{font-size:22px;font-weight:900}.small{font-size:12px;color:#777}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.search{margin-top:10px;background:#eee;border-radius:12px;padding:10px}.search input{width:100%;border:0;background:none;outline:0;font-size:16px}.screen{display:none;padding:16px}.screen.on{display:block}.hero{padding:8px 0 18px}.hero h2{margin:0 0 8px}.hero p{margin:0;color:#666;line-height:1.6}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.pill{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap}.pill.on{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.panel,.request{background:#fff;border:1px solid #e4e4e4;border-radius:16px;overflow:hidden}.photo{aspect-ratio:1;background:#eee;display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:11px}.name{font-weight:800}.meta{font-size:12px;color:#777;margin-top:4px}.tag,.status{display:inline-block;background:#f0f0f0;border-radius:999px;padding:5px 8px;font-size:11px;margin-top:7px}.panel,.request{padding:14px;margin-bottom:11px}.btn{width:100%;border:0;background:#111;color:#fff;border-radius:12px;padding:13px;font-weight:800;margin-top:9px}.btn.light{background:#eee;color:#111}.btn.danger{background:#b42318}.link{border:0;background:none;text-decoration:underline;padding:4px}.form{display:grid;gap:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px;font-size:16px}.field textarea{min-height:90px}.nav{position:fixed;bottom:0;left:0;right:0;max-width:720px;margin:auto;background:#fffffff7;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:none;color:#777;font-size:11px}.nav b{display:block;font-size:20px}.nav .on{color:#111;font-weight:800}.empty{text-align:center;color:#888;padding:44px 10px}.modal{position:fixed;inset:0;background:#0008;z-index:60;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}.toast{position:fixed;left:16px;right:16px;bottom:90px;max-width:688px;margin:auto;background:#111;color:#fff;border-radius:12px;padding:12px;z-index:80;display:none}.toast.on{display:block}.chat{display:grid;gap:8px;margin:12px 0}.msg{max-width:82%;padding:9px 11px;border-radius:13px;background:#eee}.msg.me{margin-left:auto;background:#111;color:#fff}.legal{line-height:1.8;color:#333}.divider{border:0;border-top:1px solid #eee;margin:15px 0}
.menu{display:grid;gap:9px}.menuItem{width:100%;border:1px solid #e4e4e4;background:#fff;border-radius:14px;padding:15px;text-align:left;font-weight:800;display:flex;align-items:center;justify-content:space-between}.menuItem span{color:#888;font-weight:400}.tabs{display:flex;gap:7px;overflow:auto;margin:0 0 14px}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap}.tab.on{background:#111;color:#fff}.heart{border:0;background:#fff;border-radius:999px;width:42px;height:42px;font-size:22px;box-shadow:0 1px 8px #0002}.cardWrap{position:relative}.cardHeart{position:absolute;right:8px;top:8px;z-index:3}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0}.step{text-align:center;font-size:10px;color:#aaa}.step b{display:block;margin:auto auto 4px;width:23px;height:23px;line-height:23px;border-radius:50%;background:#eee;color:#888}.step.done{color:#111;font-weight:800}.step.done b{background:#111;color:#fff}.sectionTitle{margin:22px 0 10px}
.nextAction{background:#111;color:#fff;border-radius:16px;padding:15px;margin:12px 0}
.nextAction b{display:block;font-size:13px;margin-bottom:5px}
.shipGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shipBox{background:#f6f6f7;border-radius:12px;padding:11px}
.shipBox b{display:block;font-size:12px}
.sysmsg{text-align:center;color:#777;font-size:11px;margin:8px 0}
.dangerLink{color:#b42318}
.filterPanel{background:#fff;border:1px solid #e4e4e4;border-radius:16px;padding:12px;margin-bottom:14px}
.filterGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filterGrid select,.filterGrid input{width:100%;border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px}
.sortRow{display:flex;gap:8px;overflow:auto;margin:10px 0 14px}
.sortBtn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap}
.sortBtn.on{background:#111;color:#fff}
.resultCount{font-size:12px;color:#777;margin:0 0 10px}
</style><title>めじるし交換</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.SUPABASE_URL="https://nawitoxbgtmurbbuydyi.supabase.co";
window.SUPABASE_ANON_KEY="sb_publishable_jaSr6lJckE23R8pZNsG9BA_SzgM29U_";
</script>
</head><body><div class="app">
<header><div class="row"><div><div class="brand">めじるし交換</div><div class="small">めじるしチャームを交換するアプリ</div></div><div class="row"><button class="link" id="notifyBtn" style="display:none">🔔<span id="notifyCount"></span></button><button class="link" id="authBtn">ログイン</button></div></div><div class="search">🔎 <input id="q" placeholder="チャーム名・シリーズで検索"></div></header>
<main>
<section id="home" class="screen on"><div class="hero"><h2>欲しいチャームを探そう</h2><p>シリーズ・キャラクター・状態で絞り込んで、交換相手を探せます。</p></div>
<div class="filterPanel">
  <div class="filterGrid">
    <select id="filterSeries"><option value="">すべてのシリーズ</option><option>サンリオ</option><option>ディズニー</option><option>その他</option></select>
    <select id="filterCondition"><option value="">すべての状態</option><option>未開封</option><option>開封済み・美品</option><option>使用感あり</option></select>
    <input id="filterCharacter" placeholder="キャラクター名">
    <select id="filterFav"><option value="">すべて</option><option value="favorite">お気に入りのみ</option></select>
  </div>
  <button class="btn light" id="clearFilters">絞り込みをリセット</button>
</div>
<div class="sortRow">
  <button class="sortBtn on" data-sort="new">新着順</button>
  <button class="sortBtn" data-sort="favorite">お気に入り優先</button>
  <button class="sortBtn" data-sort="name">名前順</button>
</div>
<div id="resultCount" class="resultCount"></div>
<div id="grid" class="grid"></div></section>
<section id="detail" class="screen"></section>
<section id="add" class="screen"><h2>チャームを出品</h2><div class="form"><div class="field"><label>チャーム名</label><input id="fName"></div><div class="field"><label>シリーズ</label><select id="fSeries"><option>サンリオ</option><option>ディズニー</option><option>その他</option></select></div><div class="field"><label>キャラクター</label><input id="fCharacter" placeholder="例：シナモロール"></div><div class="field"><label>状態</label><select id="fState"><option>未開封</option><option>開封済み・美品</option><option>使用感あり</option></select></div><div class="field"><label>写真</label><input id="fImage" type="file" accept="image/*"></div><div class="field"><label>説明</label><textarea id="fNote"></textarea></div><button class="btn" id="addBtn">出品する</button></div></section>
<section id="trade" class="screen"><div class="row"><h2>交換</h2><button class="link" id="refreshTrade">更新</button></div><div class="tabs"><button class="tab on" data-trade-filter="active">進行中</button><button class="tab" data-trade-filter="pending">申請中</button><button class="tab" data-trade-filter="completed">完了</button><button class="tab" data-trade-filter="all">すべて</button></div><div id="tradeList"></div></section>
<section id="room" class="screen"></section>
<section id="me" class="screen"><h2>マイページ</h2><div id="profile"></div><div id="adminPanel"></div><div class="menu">
<button class="menuItem" onclick="openMyListings()">出品管理 <span>›</span></button>
<button class="menuItem" onclick="openHistory()">取引履歴 <span>›</span></button>
<button class="menuItem" onclick="openFavorites()">お気に入り <span>›</span></button>
<button class="menuItem" onclick="openWanted()">欲しいチャーム <span>›</span></button>
<button class="menuItem" onclick="openNotificationsPage()">通知 <span>›</span></button>
<button class="menuItem" onclick="openSettings()">設定 <span>›</span></button>
<button class="menuItem" onclick="openHelp()">ヘルプ・お問い合わせ <span>›</span></button>
</div></section>
<section id="myListings" class="screen"><button class="link" onclick="go('me')">← マイページ</button><h2>出品管理</h2><div id="mine"></div></section>
<section id="favorites" class="screen"><button class="link" onclick="go('me')">← マイページ</button><h2>お気に入り</h2><div id="favoriteList" class="grid"></div></section>
<section id="wanted" class="screen"><button class="link" onclick="go('me')">← マイページ</button><h2>欲しいチャーム</h2><div class="panel form"><div class="field"><label>チャーム名</label><input id="wName"></div><div class="field"><label>シリーズ</label><select id="wSeries"><option>サンリオ</option><option>ディズニー</option><option>その他</option></select></div><div class="field"><label>キャラクター</label><input id="wCharacter"></div><div class="field"><label>メモ</label><textarea id="wNote"></textarea></div><button class="btn" onclick="addWanted()">欲しいリストに追加</button></div><div id="wantedList"></div></section>
<section id="history" class="screen"><button class="link" onclick="go('me')">← マイページ</button><h2>取引履歴</h2><div id="historyList"></div></section>
<section id="settings" class="screen"><button class="link" onclick="go('me')">← マイページ</button><h2>設定</h2><div id="settingsContent"></div></section>
<section id="help" class="screen"><button class="link" onclick="go('me')">← マイページ</button><h2>ヘルプ・お問い合わせ</h2><div class="panel"><b>困ったとき</b><p>取引トラブルは取引画面の「この取引を通報」から運営へ連絡できます。</p><p>相手とのやり取り・発送状況が分かる情報は、取引チャットに残してください。</p></div><div class="panel"><b>よくある質問</b><p>交換成立前なら申請の取り消しができます。発送後のキャンセルはアプリ上ではできません。</p></div></section>
<section id="notifications" class="screen"><div class="row"><h2>通知</h2><button class="link" onclick="markAllNotificationsRead()">すべて既読</button></div><div id="notificationList"></div></section>
<section id="admin" class="screen"><div class="row"><h2>運営管理</h2><button class="link" onclick="go('me')">戻る</button></div><div id="reportList"></div></section>
<section id="legal" class="screen"></section>
</main>
<nav class="nav"><button class="on" data-screen="home"><b>⌂</b>ホーム</button><button data-screen="add"><b>＋</b>出品</button><button data-screen="trade"><b>⇄</b>交換</button><button data-screen="me"><b>●</b>マイページ</button></nav></div>

<div id="authModal" class="modal"><div class="sheet"><div class="row"><h2 id="authTitle">ログイン</h2><button class="link" id="closeAuth">閉じる</button></div><div class="form"><div class="field"><label>メール</label><input id="email" type="email"></div><div class="field"><label>パスワード</label><input id="password" type="password"></div><div class="field" id="usernameWrap"><label>ユーザー名</label><input id="username"></div><button class="btn" id="authSubmit">ログイン</button><button class="btn light" id="toggleAuth">新規登録はこちら</button><button class="link" id="resetPasswordBtn" type="button" style="display:none">パスワードを忘れた方</button></div></div></div>
<div id="toast" class="toast"></div>

<script>const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null,items=[],trades=[],filter='すべて',authMode='login',blockedIds=[],favoriteIds=new Set(),tradeFilter='active',sortMode='new';
const $=id=>document.getElementById(id),esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2800)}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.screen===id));if(id==='home')loadItems();if(id==='trade')loadTrades();if(id==='me')loadMine();if(id==='myListings')loadMyListings();if(id==='favorites')loadFavoritePage();if(id==='wanted')loadWanted();if(id==='history')loadHistory();if(id==='settings')renderSettings();scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.screen));
$('q').oninput=renderItems;
['filterSeries','filterCondition','filterCharacter','filterFav'].forEach(id=>{let el=$(id);if(el)el.oninput=renderItems});
$('clearFilters').onclick=()=>{$('filterSeries').value='';$('filterCondition').value='';$('filterCharacter').value='';$('filterFav').value='';$('q').value='';renderItems()};
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sortMode=b.dataset.sort;document.querySelectorAll('[data-sort]').forEach(x=>x.classList.toggle('on',x===b));renderItems()});
const photo=u=>`<div class="photo">${u?`<img src="${u}" loading="lazy">`:'✨'}</div>`;

async function loadBlocks(){blockedIds=[];if(!user)return;let r=await sb.from('blocks').select('blocked_id').eq('blocker_id',user.id);blockedIds=(r.data||[]).map(x=>x.blocked_id)}
async function loadFavorites(){favoriteIds=new Set();if(!user)return;let r=await sb.from('favorites').select('charm_id').eq('user_id',user.id);if(!r.error)favoriteIds=new Set((r.data||[]).map(x=>x.charm_id))}
async function loadItems(){await loadBlocks();await loadFavorites();let r=await sb.from('charms').select('id,name,series,character_name,condition,description,image_url,owner_id,profiles!charms_owner_id_fkey(username)').eq('status','available').order('created_at',{ascending:false});if(r.error)return toast(r.error.message);items=(r.data||[]).filter(x=>!blockedIds.includes(x.owner_id));renderItems()}
function renderItems(){
  let q=$('q').value.toLowerCase().trim();
  let series=$('filterSeries')?.value||'';
  let condition=$('filterCondition')?.value||'';
  let character=($('filterCharacter')?.value||'').toLowerCase().trim();
  let favOnly=$('filterFav')?.value==='favorite';

  let a=items.filter(x=>{
    let hay=(x.name+' '+x.series+' '+(x.character_name||'')+' '+(x.description||'')).toLowerCase();
    if(q && !hay.includes(q)) return false;
    if(series && x.series!==series) return false;
    if(condition && x.condition!==condition) return false;
    if(character && !(x.character_name||'').toLowerCase().includes(character)) return false;
    if(favOnly && !favoriteIds.has(x.id)) return false;
    return true;
  });

  if(sortMode==='favorite'){
    a.sort((x,y)=>(favoriteIds.has(y.id)?1:0)-(favoriteIds.has(x.id)?1:0));
  }else if(sortMode==='name'){
    a.sort((x,y)=>String(x.name||'').localeCompare(String(y.name||''),'ja'));
  }

  if($('resultCount')) $('resultCount').textContent=`${a.length}件のチャーム`;
  $('grid').innerHTML=a.map(x=>`<div class="cardWrap"><button class="heart cardHeart" onclick="event.stopPropagation();toggleFavorite('${x.id}')">${favoriteIds.has(x.id)?'♥':'♡'}</button><div class="card" onclick="detail('${x.id}')">${photo(x.image_url)}<div class="body"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.series)}${x.character_name?' ・ '+esc(x.character_name):''} ・ ${esc(x.condition)}</div><div class="tag">交換できます</div></div></div></div>`).join('')||'<div class="empty" style="grid-column:1/-1">条件に合うチャームがありません</div>';
}
window.toggleFavorite=async id=>{if(!user)return openAuth();if(favoriteIds.has(id)){let r=await sb.from('favorites').delete().eq('user_id',user.id).eq('charm_id',id);if(r.error)return toast(r.error.message);favoriteIds.delete(id);toast('お気に入りから外しました')}else{let r=await sb.from('favorites').insert({user_id:user.id,charm_id:id});if(r.error)return toast(r.error.message);favoriteIds.add(id);toast('お気に入りに追加しました')}renderItems();if($('favorites').classList.contains('on'))loadFavoritePage()}
window.detail=async id=>{let x=items.find(a=>a.id===id);if(!x)return;let mine=[];if(user){let r=await sb.from('charms').select('id,name').eq('owner_id',user.id).eq('status','available');mine=r.data||[]}let opts=mine.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');$('detail').innerHTML=`<button class="link" onclick="go('home')">← 戻る</button>${photo(x.image_url)}<h2>${esc(x.name)}</h2><div class="small">${esc(x.series)}${x.character_name?' ・ '+esc(x.character_name):''} ・ ${esc(x.condition)} ・ ${esc(x.profiles?.username||'ユーザー')}</div><p>${esc(x.description||'')}</p>${user&&x.owner_id!==user.id?`<button class="btn light" onclick="toggleFavorite('${x.id}');detail('${x.id}')">${favoriteIds.has(x.id)?'♥ お気に入り済み':'♡ お気に入り'}</button>`:''}${!user?'<button class="btn" onclick="openAuth()">ログインして交換申請</button>':x.owner_id===user.id?'<div class="panel">あなたの出品です。</div>':`<div class="panel"><b>交換に出す自分のチャーム</b><select id="offerSelect" style="width:100%;padding:12px;margin-top:9px;border:1px solid #ddd;border-radius:12px">${opts}</select><button class="btn" onclick="sendTrade('${x.id}')">交換を申し込む</button></div><button class="btn light" onclick="blockUser('${x.owner_id}')">ブロック</button><button class="btn light" onclick="reportUser('${x.owner_id}')">通報</button>`}`;go('detail')};
window.sendTrade=async wanted=>{if(!user)return openAuth();let offered=$('offerSelect')?.value;if(!offered)return toast('交換に出すチャームがありません');let x=items.find(i=>i.id===wanted);let r=await sb.from('trade_requests').insert({requester_id:user.id,owner_id:x.owner_id,wanted_charm_id:wanted,offered_charm_id:offered});if(r.error)return toast(r.error.message);toast('交換申請を送りました');go('trade')};
window.blockUser=async uid=>{if(!confirm('ブロックしますか？'))return;let r=await sb.from('blocks').insert({blocker_id:user.id,blocked_id:uid});if(r.error&&!String(r.error.message).includes('duplicate'))return toast(r.error.message);toast('ブロックしました');go('home')};
window.reportUser=async uid=>{let reason=prompt('通報理由を入力してください');if(!reason)return;let r=await sb.from('reports').insert({reporter_id:user.id,target_user_id:uid,reason});if(r.error)return toast(r.error.message);toast('通報しました')};

async function compressImage(file){return new Promise((resolve,reject)=>{let img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?resolve(b):reject(new Error('画像変換に失敗'))},'image/jpeg',.86)};img.onerror=()=>reject(new Error('写真を読み込めません'));img.src=u})}
$('addBtn').onclick=async()=>{if(!user)return openAuth();let name=$('fName').value.trim();if(!name)return toast('チャーム名を入力してください');let url=null,file=$('fImage').files[0];if(file){try{let blob=await compressImage(file),path=`${user.id}/${crypto.randomUUID()}.jpg`;let up=await sb.storage.from('charm-images').upload(path,await blob.arrayBuffer(),{contentType:'image/jpeg',upsert:false});if(up.error)return toast('画像: '+up.error.message);url=sb.storage.from('charm-images').getPublicUrl(path).data.publicUrl}catch(e){return toast(e.message)}}let r=await sb.from('charms').insert({owner_id:user.id,name,series:$('fSeries').value,condition:$('fState').value,description:$('fNote').value,image_url:url,character_name:$('fCharacter').value.trim()||null});if(r.error)return toast(r.error.message);$('fName').value='';$('fCharacter').value='';$('fNote').value='';$('fImage').value='';toast('出品しました');go('me')};

const statusJa=s=>({pending:'申請中',accepted:'取引中',rejected:'お断り',cancelled:'キャンセル',shipping:'発送中',completed:'交換済み'}[s]||s);
async function loadTrades(){if(!user){$('tradeList').innerHTML='<div class="empty">ログインしてください</div>';return}let r=await sb.from('trade_requests').select('id,status,requester_id,owner_id,wanted_charm_id,offered_charm_id,requester_shipped_at,owner_shipped_at,requester_received_at,owner_received_at,shipping_method,shipping_eta,wanted:charms!trade_requests_wanted_charm_id_fkey(name),offered:charms!trade_requests_offered_charm_id_fkey(name)').or(`requester_id.eq.${user.id},owner_id.eq.${user.id}`).order('created_at',{ascending:false});if(r.error)return $('tradeList').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';trades=r.data||[];renderTrades()}

function nextActionText(t,incoming){
  let meShip=incoming?t.owner_shipped_at:t.requester_shipped_at;
  let otherShip=incoming?t.requester_shipped_at:t.owner_shipped_at;
  let meRecv=incoming?t.owner_received_at:t.requester_received_at;
  let otherRecv=incoming?t.requester_received_at:t.owner_received_at;
  if(t.status==='pending') return incoming?'交換申請を確認して、承認またはお断りしてください。':'相手の承認をお待ちください。';
  if(t.status==='completed') return '交換は完了しています。';
  if(!meShip) return '発送予定と発送方法を登録して、発送後に「発送しました」を押してください。';
  if(!otherShip) return 'あなたは発送済みです。相手の発送をお待ちください。';
  if(!meRecv) return '相手も発送済みです。届いたら「受け取りました」を押してください。';
  if(!otherRecv) return 'あなたは受取確認済みです。相手の受取確認をお待ちください。';
  return '双方の受取確認が済みました。評価をお願いします。';
}
async function saveShippingInfo(id){
  let method=$('shipMethod')?.value||null;
  let eta=$('shipEta')?.value||null;
  let r=await sb.from('trade_requests').update({shipping_method:method,shipping_eta:eta}).eq('id',id);
  if(r.error)return toast(r.error.message);
  toast('発送情報を保存しました');
  openRoom(id);
}

function tradeProgress(t){let level=t.status==='pending'?0:t.status==='accepted'?1:t.status==='shipping'?2:t.status==='completed'?5:0;if(t.requester_shipped_at&&t.owner_shipped_at)level=Math.max(level,3);if(t.requester_received_at&&t.owner_received_at)level=Math.max(level,4);if(t.status==='completed')level=5;let labs=['成立','発送','双方発送','受取','評価','完了'];return `<div class="progress">${labs.map((x,i)=>`<div class="step ${i<=level?'done':''}"><b>${i+1}</b>${x}</div>`).join('')}</div>`}
window.openRoom=async id=>{let r=await sb.from('trade_requests').select('id,status,requester_id,owner_id,requester_shipped_at,owner_shipped_at,requester_received_at,owner_received_at,shipping_method,shipping_eta,wanted:charms!trade_requests_wanted_charm_id_fkey(name),offered:charms!trade_requests_offered_charm_id_fkey(name)').eq('id',id).single();if(r.error)return toast(r.error.message);let t=r.data,incoming=t.owner_id===user.id,meShip=incoming?t.owner_shipped_at:t.requester_shipped_at,otherShip=incoming?t.requester_shipped_at:t.owner_shipped_at,meRecv=incoming?t.owner_received_at:t.requester_received_at;let controls='';if(t.status==='pending')controls=incoming?`<button class="btn" onclick="acceptTrade('${id}')">交換を承認</button><button class="btn light" onclick="rejectTrade('${id}')">断る</button>`:`<button class="btn light" onclick="cancelTrade('${id}')">申請を取り消す</button>`;if(['accepted','shipping'].includes(t.status)){if(!meShip)controls+=`<div class="panel"><b>発送情報</b><div class="shipGrid"><div class="field"><label>発送予定</label><select id="shipEta"><option value="今日">今日</option><option value="明日">明日</option><option value="2〜3日以内">2〜3日以内</option><option value="1週間以内">1週間以内</option></select></div><div class="field"><label>発送方法</label><select id="shipMethod"><option value="普通郵便">普通郵便</option><option value="ゆうパケット">ゆうパケット</option><option value="ネコポス">ネコポス</option><option value="その他">その他</option></select></div></div><button class="btn light" onclick="saveShippingInfo('${id}')">発送情報を保存</button><button class="btn" onclick="shipTrade('${id}')">発送しました</button></div>`;if(otherShip&&!meRecv)controls+=`<button class="btn" onclick="receiveTrade('${id}')">受け取りました</button>`;if(t.status==='accepted'&&!t.requester_shipped_at&&!t.owner_shipped_at)controls+=`<button class="btn light" onclick="cancelTrade('${id}')">取引をキャンセル</button>`;if(t.requester_shipped_at||t.owner_shipped_at)controls+=`<button class="btn light dangerLink" onclick="reportTrade('${id}','${incoming?t.requester_id:t.owner_id}')">発送後のトラブルを運営に相談</button>`}let reviews='';if(t.status==='completed'){let mine=await sb.from('reviews').select('rating,comment').eq('trade_id',id).eq('reviewer_id',user.id).maybeSingle();reviews=mine.data?`<div class="panel">あなたの評価：★${mine.data.rating}<br>${esc(mine.data.comment||'')}</div>`:`<div class="panel"><b>相手を評価</b><select id="rating" style="width:100%;padding:12px;margin-top:8px"><option value="5">★★★★★ 5</option><option value="4">★★★★ 4</option><option value="3">★★★ 3</option><option value="2">★★ 2</option><option value="1">★ 1</option></select><textarea id="reviewComment" style="width:100%;margin-top:8px;padding:12px;border:1px solid #ddd;border-radius:12px"></textarea><button class="btn" onclick="submitReview('${id}','${incoming?t.requester_id:t.owner_id}')">評価する</button></div>`}let msgs=await sb.from('messages').select('sender_id,body').eq('trade_id',id).order('created_at');let chat=(msgs.data||[]).map(m=>`<div class="msg ${m.sender_id===user.id?'me':''}">${esc(m.body)}</div>`).join('');let systemNotes=[];if(t.status!=='pending')systemNotes.push('交換が成立しました');if(t.requester_shipped_at)systemNotes.push('申請者が発送しました');if(t.owner_shipped_at)systemNotes.push('出品者が発送しました');if(t.requester_received_at)systemNotes.push('申請者が受取確認しました');if(t.owner_received_at)systemNotes.push('出品者が受取確認しました');if(systemNotes.length)chat=systemNotes.map(x=>`<div class="sysmsg">${esc(x)}</div>`).join('')+chat;$('room').innerHTML=`<button class="link" onclick="go('trade')">← 交換一覧</button><h2>${esc(t.offered?.name)} ⇄ ${esc(t.wanted?.name)}</h2>${tradeProgress(t)}<div class="nextAction"><b>あなたが次にすること</b>${esc(nextActionText(t,incoming))}</div><div class="panel"><div class="row"><b>ステータス</b><span class="status">${statusJa(t.status)}</span></div><div class="shipGrid" style="margin-top:10px"><div class="shipBox"><b>あなた</b>${meShip?'発送済み':'未発送'}${meRecv?' / 受取済み':''}</div><div class="shipBox"><b>相手</b>${otherShip?'発送済み':'未発送'}${(incoming?t.requester_received_at:t.owner_received_at)?' / 受取済み':''}</div></div>${t.shipping_method||t.shipping_eta?`<div class="small" style="margin-top:8px">発送情報：${esc(t.shipping_method||'-')} / ${esc(t.shipping_eta||'-')}</div>`:''}</div>${controls}${reviews}<hr class="divider"><h3>取引チャット</h3><div class="chat">${chat||'<div class="small">まだメッセージはありません</div>'}</div>${['accepted','shipping','completed'].includes(t.status)?`<div class="row"><input id="msgInput" placeholder="メッセージ" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:12px"><button class="btn" style="width:auto;margin:0" onclick="sendMsg('${id}')">送信</button></div>`:''}<button class="btn light" onclick="reportTrade('${id}','${incoming?t.requester_id:t.owner_id}')">この取引を通報</button>`;go('room')};

window.showLegal=type=>{let terms=`<h2>利用規約</h2><div class="legal"><p>「めじるし交換」は、ユーザー同士がめじるしチャーム等を交換するための場を提供します。</p><p>交換・発送はユーザー自身の責任で行ってください。虚偽出品、詐欺、嫌がらせ、違法品・権利侵害品の出品は禁止します。</p><p>発送後の一方的なキャンセルはできません。トラブル時は取引画面から通報してください。</p><p>運営は安全確保のため、規約違反アカウントの利用制限・削除を行うことがあります。</p></div>`;let privacy=`<h2>プライバシーポリシー</h2><div class="legal"><p>本サービスでは、アカウント作成のためのメールアドレス、ユーザー名、出品情報、画像、取引メッセージ、評価、通報情報を取り扱います。</p><p>これらはログイン、交換機能、安全対策、トラブル対応のために利用します。</p><p>パスワードは認証基盤で管理され、アプリ運営者が平文で閲覧することはありません。</p><p>ユーザーはマイページからアカウント削除を申請できます。ただし進行中の交換がある場合は、安全のため完了またはキャンセル後に削除できます。</p></div>`;$('legal').innerHTML=`<button class="link" onclick="go('me')">← 戻る</button>${type==='terms'?terms:privacy}`;go('legal')};

function openAuth(){authMode='login';$('authModal').classList.add('on');updateAuth()}function updateAuth(){$('authTitle').textContent=authMode==='login'?'ログイン':'新規登録';$('authSubmit').textContent=authMode==='login'?'ログイン':'アカウントを作成';$('toggleAuth').textContent=authMode==='login'?'新規登録はこちら':'ログインはこちら';$('usernameWrap').style.display=authMode==='login'?'none':'block';$('resetPasswordBtn').style.display=authMode==='login'?'inline-block':'none'}$('authBtn').onclick=()=>user?logout():openAuth();$('closeAuth').onclick=()=>$('authModal').classList.remove('on');$('toggleAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';updateAuth()};$('resetPasswordBtn').onclick=async()=>{let email=$('email').value.trim();if(!email)email=prompt('登録しているメールアドレスを入力してください')||'';if(!email)return;let redirectTo=location.origin+location.pathname+'?reset=1';let r=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(r.error)return toast(r.error.message);toast('パスワード再設定メールを送りました')};$('authSubmit').onclick=async()=>{let email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return toast('メールと6文字以上のパスワードを入力してください');if(authMode==='login'){let r=await sb.auth.signInWithPassword({email,password});if(r.error)return toast(r.error.message);$('authModal').classList.remove('on')}else{let username=$('username').value.trim()||'めじるしユーザー';let r=await sb.auth.signUp({email,password,options:{data:{username}}});if(r.error)return toast(r.error.message);$('authModal').classList.remove('on');toast(r.data.session?'登録しました':'確認メールを確認してください')}};async function logout(){await sb.auth.signOut();go('home')}

sb.auth.onAuthStateChange(async(e,s)=>{user=s?.user||null;$('authBtn').textContent=user?'ログアウト':'ログイン';$('notifyBtn').style.display=user?'inline-block':'none';if(e==='PASSWORD_RECOVERY'){let np=prompt('新しいパスワードを6文字以上で入力してください');if(np&&np.length>=6){let u=await sb.auth.updateUser({password:np});toast(u.error?u.error.message:'パスワードを変更しました')}else if(np!==null){toast('6文字以上で入力してください')}}loadItems();if(user)loadNotifications()});
sb.auth.getSession().then(({data})=>{user=data.session?.user||null;$('authBtn').textContent=user?'ログアウト':'ログイン';$('notifyBtn').style.display=user?'inline-block':'none';loadItems();if(user)loadNotifications()});
</script></body></html>
